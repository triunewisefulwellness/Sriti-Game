<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sriti Math Game</title>
  <style>
    :root {
      --bg1: #fff7d6;
      --bg2: #d8f6ff;
      --card: #ffffff;
      --ink: #20304a;
      --pink: #ff6fae;
      --blue: #35b7ff;
      --green: #48d17d;
      --yellow: #ffca3a;
      --shadow: 0 14px 30px rgba(32, 48, 74, 0.15);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Trebuchet MS", "Comic Sans MS", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 15%, rgba(255, 111, 174, 0.25), transparent 28%),
        radial-gradient(circle at 84% 18%, rgba(53, 183, 255, 0.22), transparent 28%),
        radial-gradient(circle at 70% 82%, rgba(72, 209, 125, 0.18), transparent 30%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .app {
      width: min(760px, 100%);
      background: rgba(255,255,255,0.86);
      border: 4px solid white;
      border-radius: 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(4px);
      padding: 20px;
    }

    .title {
      margin: 0 0 8px;
      font-size: clamp(26px, 4vw, 40px);
      text-align: center;
      color: #f15c8e;
      text-shadow: 0 2px 0 #fff;
    }

    .subtitle {
      margin: 0 0 14px;
      text-align: center;
      font-size: 18px;
    }

    .topbar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .pill {
      background: var(--card);
      border-radius: 14px;
      border: 2px solid #eef3ff;
      padding: 10px;
      text-align: center;
      font-weight: 700;
      box-shadow: 0 5px 12px rgba(32,48,74,0.06);
    }

    .modes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    button {
      border: 0;
      border-radius: 14px;
      font-weight: 700;
      color: var(--ink);
      cursor: pointer;
      transition: transform 120ms ease, box-shadow 120ms ease, opacity 120ms ease, background-color 120ms ease;
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(1px) scale(0.99); }

    .mode-btn {
      padding: 12px 8px;
      background: white;
      border: 2px solid #e8efff;
      box-shadow: 0 5px 12px rgba(32,48,74,0.06);
      font-size: 16px;
    }

    .mode-btn.active {
      background: linear-gradient(180deg, #fff, #f4fbff);
      border-color: var(--blue);
      box-shadow: 0 8px 18px rgba(53, 183, 255, 0.22);
    }

    .board {
      position: relative;
      overflow: hidden;
      background: white;
      border-radius: 18px;
      padding: 18px;
      border: 2px solid #eef3ff;
      box-shadow: inset 0 1px 0 #fff;
    }

    .star-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .board > *:not(.star-layer) {
      position: relative;
      z-index: 1;
    }

    .float-star {
      position: absolute;
      color: #ffd35a;
      text-shadow: 0 0 10px rgba(255, 211, 90, 0.5);
      opacity: 0.75;
      animation: twinkleFloat linear infinite;
      user-select: none;
    }

    @keyframes twinkleFloat {
      0% { transform: translateY(18px) scale(0.8) rotate(0deg); opacity: 0; }
      15% { opacity: 0.8; }
      50% { opacity: 1; transform: translateY(-6px) scale(1) rotate(8deg); }
      85% { opacity: 0.75; }
      100% { transform: translateY(-28px) scale(0.85) rotate(-8deg); opacity: 0; }
    }

    .question-stage {
      position: relative;
      min-height: 150px;
      margin-bottom: 10px;
      border-radius: 16px;
      background: linear-gradient(180deg, #fdfdff, #f4fbff);
      border: 2px solid #edf4ff;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .question {
      position: relative;
      z-index: 2;
      text-align: center;
      font-size: clamp(34px, 8vw, 56px);
      font-weight: 800;
      letter-spacing: 1px;
      margin: 0;
      padding: 6px 10px;
      background: rgba(255,255,255,0.7);
      border-radius: 16px;
    }

    .floating-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .float-num {
      position: absolute;
      font-weight: 800;
      opacity: 0.7;
      animation: drift 8s linear infinite;
      user-select: none;
    }

    .float-num:nth-child(3n) { color: #ff7eb3; }
    .float-num:nth-child(3n + 1) { color: #3dbdff; }
    .float-num:nth-child(3n + 2) { color: #52c878; }

    @keyframes drift {
      0% { transform: translateY(25px) translateX(0) rotate(0deg); opacity: 0; }
      15% { opacity: 0.8; }
      85% { opacity: 0.8; }
      100% { transform: translateY(-110px) translateX(16px) rotate(12deg); opacity: 0; }
    }

    #fireworks {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 12px;
    }

    .input-answer-row {
      margin-top: 12px;
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .answer-input {
      width: 180px;
      min-height: 56px;
      border-radius: 14px;
      border: 2px solid #dcecff;
      background: #ffffff;
      text-align: center;
      font-size: 26px;
      font-weight: 700;
      color: var(--ink);
      box-shadow: 0 5px 12px rgba(32,48,74,0.06);
      outline: none;
    }

    .answer-input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(53, 183, 255, 0.15);
    }

    .submit-answer { background: #c8f5d7; padding: 12px 16px; font-size: 18px; }
    .clear-answer { background: #ffeeb8; padding: 12px 16px; font-size: 18px; }

    .option-btn {
      min-height: 74px;
      font-size: clamp(24px, 5vw, 34px);
      border: 2px solid #e8efff;
      background: white;
      box-shadow: 0 5px 12px rgba(32,48,74,0.06);
    }

    .option-btn.correct-pick {
      background: #c8f5d7;
      border-color: #48d17d;
      box-shadow: 0 10px 20px rgba(72, 209, 125, 0.2);
    }

    .option-btn.wrong-pick {
      background: #ffd8e4;
      border-color: #ff6fae;
    }

    .option-btn.reveal-correct {
      background: #e6fff0;
      border-color: #48d17d;
    }

    .action-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .next { background: #b7e8ff; padding: 12px 18px; font-size: 18px; }
    .speak { background: #ffe7fa; padding: 12px 18px; font-size: 18px; }

    .message {
      margin-top: 14px;
      text-align: center;
      min-height: 28px;
      font-weight: 700;
      font-size: 20px;
    }

    .correct { color: #159b4f; }
    .wrong { color: #d9436c; }

    .stars {
      text-align: center;
      font-size: 24px;
      letter-spacing: 6px;
      min-height: 32px;
      margin-top: 6px;
      color: #ffb703;
    }

    @media (max-width: 560px) {
      .topbar { grid-template-columns: 1fr; }
      .modes { grid-template-columns: 1fr; }
      .options { grid-template-columns: 1fr; }
      .answer-input { width: 100%; max-width: 240px; }
      .app { padding: 14px; }
      .board { padding: 14px; }
      .question-stage { min-height: 130px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
      .float-num { animation: none !important; opacity: 0.2; }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Sriti Math Game">
    <h1 class="title">Sriti's Math Game</h1>
    <p class="subtitle">Pick the right answer and watch the fireworks!</p>

    <section class="topbar" aria-label="Score board">
      <div class="pill">Score: <span id="score">0</span></div>
      <div class="pill">Streak: <span id="streak">0</span></div>
      <div class="pill">Level: <span id="levelText">Easy</span></div>
    </section>

    <section class="modes" aria-label="Mode selection">
      <button class="mode-btn active" data-mode="add">Add (+)</button>
      <button class="mode-btn" data-mode="subtract">Subtract (-)</button>
      <button class="mode-btn" data-mode="mix">Mix (+/-)</button>
    </section>

    <section class="board">
      <div class="star-layer" id="starLayer" aria-hidden="true"></div>
      <div class="question-stage">
        <div class="floating-layer" id="floatingLayer" aria-hidden="true"></div>
        <canvas id="fireworks" aria-hidden="true"></canvas>
        <div class="question" id="question" aria-live="polite">2 + 1 = ?</div>
      </div>

      <div class="options" id="options" aria-label="Answer choices"></div>

      <div class="input-answer-row" aria-label="Type your answer">
        <input
          class="answer-input"
          id="answerInput"
          type="number"
          min="0"
          step="1"
          inputmode="numeric"
          placeholder="Type answer"
          aria-label="Type your answer"
        >
        <button class="submit-answer" id="submitAnswerBtn" type="button">Submit</button>
        <button class="clear-answer" id="clearAnswerBtn" type="button">Clear</button>
      </div>

      <div class="action-row">
        <button class="speak" id="speakBtn">Hear Question</button>
        <button class="next" id="nextBtn">New Question</button>
      </div>

      <div class="message" id="message" aria-live="polite"></div>
      <div class="stars" id="stars" aria-hidden="true"></div>
    </section>
  </main>

  <script>
    const scoreEl = document.getElementById("score");
    const streakEl = document.getElementById("streak");
    const levelTextEl = document.getElementById("levelText");
    const questionEl = document.getElementById("question");
    const optionsEl = document.getElementById("options");
    const messageEl = document.getElementById("message");
    const starsEl = document.getElementById("stars");
    const floatingLayerEl = document.getElementById("floatingLayer");
    const starLayerEl = document.getElementById("starLayer");
    const canvas = document.getElementById("fireworks");
    const ctx = canvas.getContext("2d");
    const answerInputEl = document.getElementById("answerInput");
    let audioCtx = null;
    let speechVoice = null;

    const state = {
      mode: "add",
      score: 0,
      streak: 0,
      currentAnswer: 0,
      currentOptions: [],
      questionLocked: false,
      fireworks: [],
      animationFrame: null,
      currentQuestionText: "",
      currentPromptSpeech: ""
    };

    const praise = ["Great job!", "Awesome!", "Yay! Correct!", "Super smart!", "Nice work!"];
    const retry = ["Try again!", "Almost! You can do it!", "Good try. Count again!", "Let's try one more time!"];
    const fireworkColors = ["#ff6fae", "#35b7ff", "#48d17d", "#ffca3a", "#9b7cff", "#ff8a3d"];

    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function pick(arr) {
      return arr[randInt(0, arr.length - 1)];
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i -= 1) {
        const j = randInt(0, i);
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function getDifficultyMax() {
      if (state.score >= 12) return 20;
      if (state.score >= 6) return 15;
      return 10;
    }

    function updateLevel() {
      if (state.score >= 12) levelTextEl.textContent = "Big Star";
      else if (state.score >= 6) levelTextEl.textContent = "Growing";
      else levelTextEl.textContent = "Easy";
    }

    function setMessage(text, kind = "") {
      messageEl.textContent = text;
      messageEl.className = `message ${kind}`.trim();
    }

    function renderScore() {
      scoreEl.textContent = state.score;
      streakEl.textContent = state.streak;
      updateLevel();
      starsEl.textContent = "★".repeat(Math.min(state.streak, 10));
    }

    function loadSpeechVoice() {
      if (!("speechSynthesis" in window)) return;
      const voices = window.speechSynthesis.getVoices();
      if (!voices.length) return;
      speechVoice =
        voices.find((v) => /en/i.test(v.lang) && /female|samantha|victoria|zira|karen/i.test(v.name)) ||
        voices.find((v) => /en/i.test(v.lang)) ||
        voices[0];
    }

    function speakPrompt(text) {
      if (!text || !("speechSynthesis" in window)) return;
      const synth = window.speechSynthesis;
      try {
        synth.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 0.9;
        utterance.pitch = 1.25;
        utterance.volume = 1;
        if (speechVoice) utterance.voice = speechVoice;
        synth.speak(utterance);
      } catch (_) {
        // Ignore speech errors on unsupported browsers/devices.
      }
    }

    function speakCorrectAnswer(answer) {
      if (!("speechSynthesis" in window)) return;
      const synth = window.speechSynthesis;
      try {
        synth.cancel();
        const utterance = new SpeechSynthesisUtterance(`Correct! The answer is ${answer}.`);
        utterance.rate = 0.95;
        utterance.pitch = 1.3;
        utterance.volume = 1;
        if (speechVoice) utterance.voice = speechVoice;
        synth.speak(utterance);
      } catch (_) {
        // Ignore speech errors on unsupported browsers/devices.
      }
    }

    function generateOptions(correct) {
      const max = Math.max(getDifficultyMax() * 2, correct + 4, 10);
      const set = new Set([correct]);
      let tries = 0;
      while (set.size < 4 && tries < 80) {
        tries += 1;
        const spread = randInt(1, 4);
        const sign = Math.random() < 0.5 ? -1 : 1;
        const candidate = Math.max(0, correct + sign * spread + randInt(-1, 1));
        set.add(candidate);
      }
      while (set.size < 4) {
        set.add(randInt(0, max));
      }
      return shuffle(Array.from(set)).slice(0, 4);
    }

    function renderOptions() {
      optionsEl.innerHTML = "";
      state.currentOptions.forEach((value, index) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.type = "button";
        btn.dataset.value = String(value);
        btn.textContent = value;
        btn.setAttribute("aria-label", `Option ${index + 1}: ${value}`);
        btn.addEventListener("click", () => chooseAnswer(btn, value));
        optionsEl.appendChild(btn);
      });
    }

    function setInputsEnabled(enabled) {
      answerInputEl.disabled = !enabled;
      if (enabled) answerInputEl.focus();
    }

    function disableChoiceButtons() {
      const buttons = Array.from(optionsEl.querySelectorAll(".option-btn"));
      buttons.forEach((btn) => {
        btn.disabled = true;
        btn.style.opacity = "0.95";
      });
      return buttons;
    }

    function markCorrectButton(buttons) {
      const correctBtn = buttons.find((btn) => Number(btn.dataset.value) === state.currentAnswer);
      if (correctBtn) correctBtn.classList.add("reveal-correct");
    }

    function handleCorrect(selectedButton = null) {
      if (selectedButton) selectedButton.classList.add("correct-pick");
      state.score += 1;
      state.streak += 1;
      renderScore();
      setMessage(pick(praise), "correct");
      if (state.streak >= 3) {
        starsEl.textContent = "★".repeat(Math.min(state.streak, 10)) + "  GREAT!";
      }
      launchFireworksBurst();
      playVirtualClap();
      playCheer();
      setTimeout(() => speakCorrectAnswer(state.currentAnswer), 650);
    }

    function handleWrong(selectedButton = null) {
      if (selectedButton) selectedButton.classList.add("wrong-pick");
      state.streak = 0;
      renderScore();
      setMessage(`${pick(retry)} Answer: ${state.currentAnswer}`, "wrong");
      markCorrectButton(Array.from(optionsEl.querySelectorAll(".option-btn")));
    }

    function gradeAnswer(value, selectedButton = null) {
      if (state.questionLocked) return;
      if (!Number.isFinite(value)) {
        setMessage("Type a number first!", "wrong");
        return;
      }
      state.questionLocked = true;
      const buttons = disableChoiceButtons();
      setInputsEnabled(false);

      if (value === state.currentAnswer) {
        handleCorrect(selectedButton);
      } else {
        handleWrong(selectedButton);
      }

      if (!selectedButton) {
        markCorrectButton(buttons);
      }
    }

    function buildQuestion() {
      const max = getDifficultyMax();
      let a = randInt(0, max);
      let b = randInt(0, max);
      let op = "+";

      if (state.mode === "subtract") op = "-";
      else if (state.mode === "mix") op = Math.random() < 0.5 ? "+" : "-";

      if (op === "-") {
        if (b > a) [a, b] = [b, a];
        state.currentAnswer = a - b;
      } else {
        state.currentAnswer = a + b;
      }

      state.currentQuestionText = `${a} ${op} ${b} = ?`;
      state.currentPromptSpeech =
        op === "+"
          ? `What is ${a} plus ${b}?`
          : `What is ${a} minus ${b}?`;
      questionEl.textContent = state.currentQuestionText;
      state.currentOptions = generateOptions(state.currentAnswer);
      state.questionLocked = false;
      renderOptions();
      answerInputEl.value = "";
      setInputsEnabled(true);
      refreshFloatingNumbers(a, b, state.currentAnswer);
      setMessage("Pick the right answer!");
      setTimeout(() => speakPrompt(state.currentPromptSpeech), 120);
    }

    function chooseAnswer(button, value) {
      gradeAnswer(value, button);
    }

    function setMode(mode) {
      state.mode = mode;
      document.querySelectorAll(".mode-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.mode === mode);
      });
      buildQuestion();
    }

    function refreshFloatingNumbers(a, b, answer) {
      floatingLayerEl.innerHTML = "";
      const nums = [a, b, answer, randInt(0, 9), randInt(0, 9), randInt(0, 9), "+", "-"];
      nums.forEach((value, i) => {
        const el = document.createElement("div");
        el.className = "float-num";
        el.textContent = String(value);
        el.style.left = `${randInt(4, 90)}%`;
        el.style.top = `${randInt(55, 95)}%`;
        el.style.fontSize = `${randInt(18, 34)}px`;
        el.style.animationDelay = `${(i % 6) * 0.6}s`;
        el.style.animationDuration = `${randInt(6, 10)}s`;
        floatingLayerEl.appendChild(el);
      });
    }

    function buildStarLayer() {
      starLayerEl.innerHTML = "";
      for (let i = 0; i < 26; i += 1) {
        const star = document.createElement("div");
        star.className = "float-star";
        star.textContent = Math.random() < 0.75 ? "★" : "✦";
        star.style.left = `${randInt(2, 96)}%`;
        star.style.top = `${randInt(2, 94)}%`;
        star.style.fontSize = `${randInt(10, 22)}px`;
        star.style.animationDuration = `${randInt(4, 9)}s`;
        star.style.animationDelay = `${(Math.random() * 4).toFixed(2)}s`;
        star.style.opacity = `${(0.4 + Math.random() * 0.5).toFixed(2)}`;
        starLayerEl.appendChild(star);
      }
    }

    function sizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.floor(rect.width * ratio);
      canvas.height = Math.floor(rect.height * ratio);
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    function createFirework(x, y) {
      const particles = [];
      const count = 24;
      for (let i = 0; i < count; i += 1) {
        const angle = (Math.PI * 2 * i) / count;
        const speed = randInt(2, 5) + Math.random();
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: randInt(22, 36),
          color: pick(fireworkColors),
          size: randInt(2, 4)
        });
      }
      state.fireworks.push(particles);
      if (!state.animationFrame) animateFireworks();
    }

    function launchFireworksBurst() {
      sizeCanvas();
      const rect = canvas.getBoundingClientRect();
      createFirework(rect.width * 0.3, rect.height * 0.45);
      createFirework(rect.width * 0.7, rect.height * 0.38);
      setTimeout(() => {
        createFirework(rect.width * 0.5, rect.height * 0.28);
      }, 180);
    }

    function getAudioCtx() {
      if (!audioCtx) {
        const AudioCtor = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtor) return null;
        audioCtx = new AudioCtor();
      }
      return audioCtx;
    }

    function playVirtualClap() {
      const ac = getAudioCtx();
      if (!ac) return;
      if (ac.state === "suspended") ac.resume();

      const start = ac.currentTime;
      const clapHits = [0, 0.08, 0.16, 0.25, 0.35, 0.46, 0.58, 0.72];

      clapHits.forEach((offset, idx) => {
        const duration = 0.08;
        const sampleCount = Math.floor(ac.sampleRate * duration);
        const buffer = ac.createBuffer(1, sampleCount, ac.sampleRate);
        const channel = buffer.getChannelData(0);

        for (let i = 0; i < sampleCount; i += 1) {
          const t = i / sampleCount;
          const decay = Math.exp(-11 * t);
          const noise = (Math.random() * 2 - 1) * decay;
          const thump = Math.sin(2 * Math.PI * (170 + idx * 22) * (i / ac.sampleRate)) * 0.22 * decay;
          channel[i] = (noise * 0.9) + thump;
        }

        const source = ac.createBufferSource();
        const filter = ac.createBiquadFilter();
        const gain = ac.createGain();

        source.buffer = buffer;
        filter.type = "bandpass";
        filter.frequency.value = 900 + idx * 70;
        filter.Q.value = 0.8;

        gain.gain.setValueAtTime(0.0001, start + offset);
        gain.gain.exponentialRampToValueAtTime(0.23, start + offset + 0.004);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + offset + duration);

        source.connect(filter);
        filter.connect(gain);
        gain.connect(ac.destination);

        source.start(start + offset);
        source.stop(start + offset + duration);
      });
    }

    function playCheer() {
      const ac = getAudioCtx();
      if (!ac) return;
      if (ac.state === "suspended") ac.resume();

      const start = ac.currentTime;
      const voices = [
        { freq: 520, pan: -0.5, delay: 0.00 },
        { freq: 660, pan: 0.1, delay: 0.03 },
        { freq: 780, pan: 0.55, delay: 0.06 }
      ];

      voices.forEach((voice, i) => {
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        const filter = ac.createBiquadFilter();
        let panner = null;

        osc.type = i % 2 === 0 ? "triangle" : "sawtooth";
        osc.frequency.setValueAtTime(voice.freq, start + voice.delay);
        osc.frequency.linearRampToValueAtTime(voice.freq * 1.22, start + voice.delay + 0.12);
        osc.frequency.linearRampToValueAtTime(voice.freq * 0.95, start + voice.delay + 0.34);

        filter.type = "lowpass";
        filter.frequency.value = 2200;

        gain.gain.setValueAtTime(0.0001, start + voice.delay);
        gain.gain.exponentialRampToValueAtTime(0.035, start + voice.delay + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + voice.delay + 0.42);

        if (ac.createStereoPanner) {
          panner = ac.createStereoPanner();
          panner.pan.value = voice.pan;
        }

        osc.connect(filter);
        filter.connect(gain);
        if (panner) {
          gain.connect(panner);
          panner.connect(ac.destination);
        } else {
          gain.connect(ac.destination);
        }

        osc.start(start + voice.delay);
        osc.stop(start + voice.delay + 0.45);
      });

      const crowd = ac.createBufferSource();
      const crowdLen = Math.floor(ac.sampleRate * 0.55);
      const crowdBuffer = ac.createBuffer(1, crowdLen, ac.sampleRate);
      const crowdData = crowdBuffer.getChannelData(0);
      for (let i = 0; i < crowdLen; i += 1) {
        const t = i / crowdLen;
        const env = Math.sin(Math.PI * Math.min(1, t * 1.3)) * (1 - t * 0.4);
        crowdData[i] = (Math.random() * 2 - 1) * env * 0.12;
      }

      const crowdFilter = ac.createBiquadFilter();
      crowdFilter.type = "bandpass";
      crowdFilter.frequency.value = 1400;
      crowdFilter.Q.value = 0.7;
      const crowdGain = ac.createGain();
      crowdGain.gain.setValueAtTime(0.0001, start + 0.02);
      crowdGain.gain.exponentialRampToValueAtTime(0.16, start + 0.08);
      crowdGain.gain.exponentialRampToValueAtTime(0.0001, start + 0.58);

      crowd.buffer = crowdBuffer;
      crowd.connect(crowdFilter);
      crowdFilter.connect(crowdGain);
      crowdGain.connect(ac.destination);
      crowd.start(start + 0.02);
      crowd.stop(start + 0.6);
    }

    function animateFireworks() {
      state.animationFrame = requestAnimationFrame(animateFireworks);
      const w = canvas.getBoundingClientRect().width;
      const h = canvas.getBoundingClientRect().height;
      ctx.clearRect(0, 0, w, h);

      state.fireworks = state.fireworks
        .map((group) => group.filter((p) => p.life > 0))
        .filter((group) => group.length > 0);

      for (const group of state.fireworks) {
        for (const p of group) {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.05;
          p.vx *= 0.99;
          p.life -= 1;
          ctx.globalAlpha = Math.max(0, p.life / 36);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.globalAlpha = 1;

      if (state.fireworks.length === 0) {
        cancelAnimationFrame(state.animationFrame);
        state.animationFrame = null;
        ctx.clearRect(0, 0, w, h);
      }
    }

    document.getElementById("nextBtn").addEventListener("click", buildQuestion);
    document.getElementById("submitAnswerBtn").addEventListener("click", () => {
      gradeAnswer(Number(answerInputEl.value));
    });
    document.getElementById("clearAnswerBtn").addEventListener("click", () => {
      if (state.questionLocked) return;
      answerInputEl.value = "";
      answerInputEl.focus();
    });
    answerInputEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        gradeAnswer(Number(answerInputEl.value));
      }
    });
    document.getElementById("speakBtn").addEventListener("click", () => {
      speakPrompt(state.currentPromptSpeech);
    });
    document.querySelectorAll(".mode-btn").forEach((btn) => {
      btn.addEventListener("click", () => setMode(btn.dataset.mode));
    });

    window.addEventListener("resize", sizeCanvas);
    if ("speechSynthesis" in window) {
      loadSpeechVoice();
      window.speechSynthesis.onvoiceschanged = loadSpeechVoice;
    }

    renderScore();
    buildStarLayer();
    sizeCanvas();
    buildQuestion();
  </script>
